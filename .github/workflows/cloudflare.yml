name: Deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cloudflare
      - run: node --test server/*.test.mjs tests/*.test.mjs
      - name: Load Pages variables from Wrangler
        run: echo "VITE_GOOGLE_ANALYTICS_ID=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')).vars.VITE_GOOGLE_ANALYTICS_ID || '')")" >> "$GITHUB_ENV"
      - run: npm run build:cloudflare
      - run: npm run build:cloud-api
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dist
          path: dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-api
          path: .local/cloud-api-build/worker.mjs
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://jlpt.erzhiqian.cc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-api
          path: .local/cloud-api-build
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository variable'; exit 1; }
      - name: Verify Cloudflare Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-access.mjs
      - name: Deploy API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config cloudflare/wrangler.api.json
      - name: Deploy frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist --project-name jlpt-master-deck --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify deployed frontend and API
        run: |
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors https://jlpt.erzhiqian.cc/ -o /dev/null
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors https://jlpt.erzhiqian.cc/api/deployment
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors https://jlpt.erzhiqian.cc/api/health | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const h=JSON.parse(s);if(!h.ok||h.backend!=="cloudflare")process.exit(1)})'
