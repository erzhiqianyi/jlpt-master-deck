<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="840" viewBox="0 0 1540 840">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#805244"/></marker></defs>
<rect width="100%" height="100%" fill="#fffaf7"/>
<style>text{font-family:Arial,"Hiragino Sans",sans-serif;fill:#382f2c;font-size:16px}.title{font-size:24px;font-weight:bold}.legend{font-size:14px}</style>
<text x="24" y="38" class="title">关键聚合：知识点、题目版本、素材、练习快照与作答</text>
<text x="24" y="67" class="legend">实线：实体/版本引用 · 虚线：事件依赖 · 边上标明基数 · 目标模型，未落地项见阶段表</text>
<polyline points="490,168 320,168" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="325" y="145" class="legend">KnowledgeLink N:M</text>
<polyline points="630,235 630,400" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="645" y="330" class="legend">拥有 1:N</text>
<polyline points="980,170 800,170 800,460 770,460" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="810" y="315" class="legend">Entry → Version N:1</text>
<polyline points="980,460 770,460" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="790" y="440" class="legend">冻结引用 N:1</text>
<polyline points="1120,235 1120,400" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="1135" y="320" class="legend">练习 → 轮次 1:N</text>
<polyline points="1120,525 1120,680" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="1135" y="610" class="legend">提交事件 1:N</text>
<polyline points="490,460 320,460" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="335" y="440" class="legend">MaterialRef N:M</text>
<polyline points="40,730 20,730 20,95 630,95 630,110" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="40" y="650" class="legend">别名 N:1</text>
<polyline points="630,680 630,525" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="645" y="610" class="legend">QuestionRef 1:N</text>
<polyline points="490,735 380,735 380,515 320,515" fill="none" stroke="#805244" stroke-width="2" marker-end="url(#arrow)" />
<text x="390" y="650" class="legend">MaterialRef 1:N</text>
<rect x="40" y="110" width="280" height="125" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="54" y="137" class="">知识点聚合 KnowledgeItem</text>
<text x="54" y="162" class="">id / owner</text>
<text x="54" y="187" class="">词形、例句、活用</text>
<rect x="490" y="110" width="280" height="125" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="504" y="137" class="">题目聚合 Question</text>
<text x="504" y="162" class="">id / owner / status / revision</text>
<text x="504" y="187" class="">knowledgeLinks / materialGroupId</text>
<rect x="490" y="400" width="280" height="125" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="504" y="427" class="">实体 QuestionVersion</text>
<text x="504" y="452" class="">questionId + revision（不可变）</text>
<text x="504" y="477" class="">Task / Options / Answer</text>
<text x="504" y="502" class="">Explanation / EvidenceRef</text>
<rect x="40" y="400" width="280" height="125" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="54" y="427" class="">素材聚合 Material</text>
<text x="54" y="452" class="">id / owner / audioAssetId(AU)</text>
<text x="54" y="477" class="">1:N MaterialVersion</text>
<rect x="980" y="110" width="280" height="125" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="994" y="137" class="">练习聚合 PracticeSet</text>
<text x="994" y="162" class="">1:N Entry(entryId,order,section)</text>
<text x="994" y="187" class="">QuestionRef / MaterialRef 冻结</text>
<rect x="980" y="400" width="280" height="125" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="994" y="427" class="">作答聚合 Attempt</text>
<text x="994" y="452" class="">id / practiceSetId / snapshot</text>
<text x="994" y="477" class="">旧实例 ID/history 保留</text>
<rect x="40" y="680" width="280" height="115" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="54" y="707" class="">实体 SourceAlias</text>
<text x="54" y="732" class="">owner + 来源定位 唯一键</text>
<text x="54" y="757" class="">旧 DR/PR/LS/item → canonical</text>
<rect x="980" y="680" width="280" height="115" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="994" y="707" class="">事件 AnswerSubmitted</text>
<text x="994" y="732" class="">eventId / entryId / versionRef</text>
<text x="994" y="757" class="">selectedOptionId / occurredAt</text>
<rect x="490" y="680" width="280" height="115" rx="12" fill="#f1e7df" stroke="#a34f3f"/>
<text x="504" y="707" class="">素材组聚合 MaterialGroup</text>
<text x="504" y="732" class="">有序 materialRefs / questionRefs</text>
<text x="504" y="757" class="">整组抽题；专项保持完整材料</text>
</svg>