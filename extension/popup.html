<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>JLPT 查词助手</title>
  <style>
    body { width: 260px; margin: 0; padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; color: #1f1f1f; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    p { margin: 4px 0; }
    button { display: block; width: 100%; margin-top: 8px; padding: 8px 10px; font: inherit; border: none;
      border-radius: 6px; cursor: pointer; background: #2563eb; color: #fff; }
    button.secondary { background: #e5e7eb; color: #1f1f1f; }
    button:disabled { background: #9ca3af; cursor: default; }
    .muted { color: #666; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h1>JLPT 查词助手</h1>
  <div id="state">加载中…</div>
  <button id="login" type="button">登录</button>
  <button id="manage" type="button" class="secondary">打开管理页</button>
  <button id="logout" type="button" class="secondary">退出登录</button>
  <script src="popup.js"></script>
</body>
</html>
